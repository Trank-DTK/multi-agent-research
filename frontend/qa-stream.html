<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>界面验证（模拟数据）</title><div id="app"></div><script type="module">
import{createApp}from'vue';import{createPinia}from'pinia';import{createRouter,createMemoryHistory}from'vue-router';import ElementPlus from'element-plus';import * as icons from'@element-plus/icons-vue';import'element-plus/dist/index.css';import'./src/styles/theme.css';import'./src/styles/workspace.css';import App from'./src/App.vue';import Dashboard from'./src/views/dashboard.vue';import Settings from'./src/views/Settings.vue';import Documents from'./src/views/Documents.vue';import Analysis from'./src/views/DataAnalysis.vue';import Collaboration from'./src/views/Collaboration.vue';import Agent from'./src/views/AgentChat.vue';import Chat from'./src/views/Chat.vue';import Writing from'./src/views/PaperWriting.vue';import axios from'./src/axios';import{useThemeStore}from'./src/stores/theme';
let providers=[];const docs=[{id:1,title:'小样本学习方法与实验评估',file_name:'research.pdf',file_size:125400,page_count:12,uploaded_at:new Date().toISOString()}];const dataset={id:1,name:'实验结果数据',row_count:120,column_count:3,file_size:4096,uploaded_at:new Date().toISOString()};
axios.defaults.adapter=async config=>{let data=[];let body=typeof config.data==='string'?JSON.parse(config.data):config.data;let url=config.url;if(url==='/auth/user/')data={username:'研究员',email:'researcher@example.test'};else if(url==='/settings/providers/'){if(config.method==='post'){providers.push({...body,id:providers.length+1,has_api_key:!!body.api_key});data=providers.at(-1)}else data=providers}else if(url.includes('/settings/providers/')&&url.endsWith('/test/'))data={message:'连接成功（模拟接口）'};else if(url==='/documents/')data=docs;else if(url==='/datasets/')data=[dataset];else if(url==='/datasets/1/')data={...dataset,columns:['实验组','准确率','样本数'],preview:[{'实验组':'对照组','准确率':0.81,'样本数':60},{'实验组':'实验组','准确率':0.89,'样本数':60}]};else if(url.includes('/visualize/'))data={chart_type:body.chart_type,title:'实验结果',chart_data:{x:['对照组','实验组'],y:[0.81,0.89],values:[1,1,1],bins:20}};else if(url.includes('/analyze/'))data={insight:'这是模拟的统计解读，用于验证页面。',result:{count:120,mean:0.85}};else if(url.includes('/collaboration/'))data={response:'研究方案（模拟）',results:{literature_review:'文献分析（模拟）',experiment_design:'实验设计（模拟）'},review:body.with_review?'评审意见（模拟）':undefined};else if(config.method==='post')data={response:'这是用于界面验证的模拟回复。',conversation_id:1};return{data,status:200,statusText:'OK',headers:{},config}};
window.fetch=async()=>new Response(new ReadableStream({start(controller){const chunks=['这是第一段。','这是第二段，','内容持续增加。'];controller.enqueue(new TextEncoder().encode('data: {"conversation_id":1}\n\n'));const timer=setInterval(()=>{if(chunks.length)controller.enqueue(new TextEncoder().encode('data: '+JSON.stringify({token:chunks.shift()})+'\n\n'));else{controller.enqueue(new TextEncoder().encode('data: [DONE]\n\n'));controller.close();clearInterval(timer)}},1000)}}),{headers:{'content-type':'text/event-stream'}});
const router=createRouter({history:createMemoryHistory(),routes:[...Object.entries({dashboard:Dashboard,settings:Settings,documents:Documents,analysis:Analysis,collaboration:Collaboration,agent:Agent,chat:Chat,writing:Writing}).map(([path,component])=>({path:'/'+path,component,meta:{requiresAuth:true}})),{path:'/:pathMatch(.*)*',redirect:'/dashboard'}]});const app=createApp(App);app.use(createPinia());app.use(router);app.use(ElementPlus);for(const[key,component]of Object.entries(icons))app.component(key,component);useThemeStore().init();await router.push('/chat');app.mount('#app');
</script></html>
